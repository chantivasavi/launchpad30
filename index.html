<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaunchPad 30 Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F7F8FA;--surface:#FFFFFF;--ink:#16181D;--muted:#676C76;--line:#E3E5EA;--accent:#3447D4;--accent-soft:#ECEEFC;--red:#C93A30;--red-soft:#FBECEA;--green:#23855A;--green-soft:#E6F4EC;--amber:#A96B08;--amber-soft:#FBF1DC;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#121317;--surface:#1A1C22;--ink:#ECEDF0;--muted:#9499A3;--line:#2A2D35;--accent:#8E9AFF;--accent-soft:#23274A;--red:#F0766C;--red-soft:#3A1F1D;--green:#5CC592;--green-soft:#17301F;--amber:#E0AC4F;--amber-soft:#34290F}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
h1{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:15px;font-weight:600;margin:0}
p{margin:0}
small,.muted{color:var(--muted)}
small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#101225}}
.btn.danger{color:var(--red)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:92px;resize:vertical}
input[type=range]{padding:0;border:0;min-height:28px;accent-color:var(--accent);background:none}
input[type=checkbox]{width:auto;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;padding:0 10px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav svg,.tab svg,.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.side .who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 28px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:600;flex:none}
.top .search{flex:1;max-width:340px;margin-left:auto}
.icon{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.count{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.page{padding:26px 28px 80px;max-width:940px}
.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .top .ttl{display:none}
  .top .search{max-width:none;margin:0}
  .page{padding:18px 16px 110px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
  .tab.on{color:var(--accent)}
  .two{grid-template-columns:1fr}
  h1{font-size:23px}
}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.sec{margin-top:28px}
.sec>.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow.wrap b{white-space:normal}
.grow small{display:block}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.st{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--muted)}
.st-in_progress{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.st-blocked{border-color:var(--red);background:var(--red)}
.st-completed{border-color:var(--green);background:var(--green)}
.st-review{border-color:var(--amber);background:radial-gradient(circle,var(--amber) 35%,transparent 40%)}
.banner{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin-bottom:16px}
.banner .grow{min-width:200px}
.banner b{display:block;font-weight:700;margin-bottom:2px}
.banner.amber{background:var(--amber-soft);border-color:transparent}
.banner.amber b{color:var(--amber)}
.banner.green{background:var(--green-soft);border-color:transparent}
.banner.green b{color:var(--green)}
.banner.blue{background:var(--accent-soft);border-color:transparent}
.banner.blue b{color:var(--accent)}
.banner .acts{display:flex;gap:6px;flex-wrap:wrap}
.nav .badge,.tab .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;margin-left:auto}
.tab{position:relative}
.tab .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
.dots i.wfh{background:transparent;box-shadow:inset 0 0 0 1.5px var(--amber)}
.due{font-size:13px;color:var(--muted);flex:none}
.due.late{color:var(--red);font-weight:600}
.due.now{color:var(--accent);font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted);flex:none;white-space:nowrap}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.av{border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;object-fit:cover;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stats div{padding:14px 16px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:24px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--line)}}
.seg{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.seg button{flex:none;height:34px;padding:0 12px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--surface);border-color:var(--line);color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kv label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.kv select{min-height:34px;padding:4px 8px}
.back{display:inline-block;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:10px}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dow{padding:8px 0;text-align:center;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.cal button{min-height:58px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:none;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.cal button:nth-child(7n+1){border-left:0}
.cal button.sel{background:var(--accent-soft)}
.cal button.tod span{background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal button span{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.leave{background:var(--amber)}
.dots i.event{background:var(--green)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.45);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px}
.sheet h2{font-size:18px;margin-bottom:16px}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.note{padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px 18px}
.auth-card{width:100%;max-width:400px}
.auth-card h1{margin-bottom:6px}
.auth-card .sub{color:var(--muted);margin-bottom:22px}
.auth-card .alt{margin-top:16px;font-size:14px;color:var(--muted)}
/* Attendance */
.punch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 18px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.punch .when{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.punch .when b{display:block;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.punch .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.big{height:48px;padding:0 22px;font-size:16px;border-radius:10px}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.btn.go{color:#0c1a12}}
@media (max-width:560px){.punch{grid-template-columns:1fr}.punch .acts{justify-content:stretch}.punch .acts .btn{flex:1}}
.loc{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
details.attfold{margin-bottom:6px}
details.attfold>summary{list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;-webkit-tap-highlight-color:transparent}
details.attfold>summary::-webkit-details-marker{display:none}
details.attfold>summary .chev{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
details.attfold>summary .chev::after{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.attfold[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
details.attfold[open]>summary .chev::after{transform:rotate(-135deg);margin-top:4px}
details.attfold .attbody{padding:0 0 4px}
details.attfold[open] .punch{border-top-left-radius:0;border-top-right-radius:0;border-top:1px dashed var(--line)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px;margin-bottom:12px}
.filters .field{margin:0}
.filters select,.filters input{min-height:36px;padding:5px 9px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
.tbl th{border-top:0;font-size:12px;font-weight:600;color:var(--muted)}
.tbl td.wrap{white-space:normal;min-width:160px}
.tbl tr.click{cursor:pointer}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.warn{background:var(--amber)}
.meter i.over{background:var(--red)}
.dots i.holiday{background:var(--red)}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-weight:500}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>
<script>
const sb = supabase.createClient('https://swsgehwrsfftqobdjpff.supabase.co', 'sb_publishable_A_XD_57MohmK0zGlc6zkwg_4Kjyh82h');
const S = {me:null,people:[],depts:[],tasks:[],leaves:[],offs:[],notes:[],acts:[],events:[],locs:[],wfh:[],q:'',taskTab:'mine',taskStatus:'open',leaveTab:'mine',cal:null,calDay:null,authMode:'login',authMsg:'',recovery:/type=recovery/.test(location.hash),
  settings:null,leadTypes:[],teamLeads:[],att:[],vio:[],ledger:[],bal:{},audit:[],attMonths:new Set(),attTab:'me',attF:{}};
const ROLE = {founder:'Founder',cofounder:'Co-Founder',director:'Director',techlead:'Tech lead',member:'Team member'};
/* Leaders show their own title (CTO, COO...) when set, otherwise the role name */
const roleLabel = p => (leader(p) && p.leadership_title) || ROLE[p?.role] || '';
const ORG_ROLE = {founder:'Founder',cofounder:'Co-Founder',director:'Director',member:'Employee'};
const STATUS = {todo:'To do',in_progress:'In progress',blocked:'Blocked',review:'Submitted for review',completed:'Completed'};
const WORK = {todo:'To do',in_progress:'In progress',blocked:'Blocked'};
const PRIO = {low:'Low',medium:'Medium',high:'High',urgent:'Urgent'};
const LTYPE = {casual:'Casual leave',sick:'Sick leave',personal:'Personal leave',emergency:'Emergency leave',other:'Other'};
const LTYPE_ALL = {...LTYPE, wfh:'Work from home'};
const VIS = {private:'Private',team:'Assigned team',everyone:'Everyone'};
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  tasks:'<path d="M10 6h10M10 12h10M10 18h10M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  leave:'<path d="M14 4h5v16h-5M10 8l4 4-4 4M14 12H4"/>',
  people:'<path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM21 19v-1a4 4 0 0 0-3-3.8M16 3.2a3.5 3.5 0 0 1 0 6.6"/>',
  calendar:'<path d="M8 3v4M16 3v4M4 10h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"/>',
  bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/>',
  more:'<path d="M5 12h.01M12 12h.01M19 12h.01"/>',
  attendance:'<path d="M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = new Date(s+'T00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const fmt = s => s ? new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : 'Not set';
const fmtLong = s => new Date(s+'T00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
const ago = ts => { const s=(Date.now()-new Date(ts))/1e3; if(s<60)return 'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; if(s<604800)return Math.floor(s/86400)+'d ago'; return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
const P = id => S.people.find(p => p.id === id);
const nm = id => P(id)?.full_name || 'Someone';
const D = id => S.depts.find(d => d.id === id)?.name || '';
const leader = p => ['founder','cofounder','director'].includes(p?.role);
const isLead = () => leader(S.me);
const team = p => ['member','techlead'].includes(p?.role);
const isWfh = l => l.kind==='wfh';
const onLeave = id => leaveOn(id, today());
const leaveOn = (id,d) => S.offs.some(o => o.kind!=='wfh' && o.user_id===id && o.start_date<=d && o.end_date>=d);
const wfhOn = (id,d) => S.offs.some(o => o.kind==='wfh' && o.user_id===id && o.start_date<=d && o.end_date>=d);
const whereOn = (id,d) => leaveOn(id,d) ? 'on leave' : wfhOn(id,d) ? 'working from home' : '';
const canApprove = l => { const a = P(l.user_id); return l.user_id!==S.me.id && !!a && (S.me.role==='founder' || (S.me.role==='director' && team(a))); };
/* Flexible leadership: org roles (Founder, Co-Founder, Director) + any number of configurable team leads per department */
/* Administrators = organisation leadership (Founder, Co-Founder, Director). Team leads are never administrators. */
const isAdmin = () => S.me?.status==='active' && leader(S.me);
const activeLT = id => S.leadTypes.find(t => t.id===id && t.active);
const leadsOf = id => S.teamLeads.filter(l => l.user_id===id && activeLT(l.lead_type_id));
const isTeamLead = p => !!p && (p.role==='techlead' || leadsOf(p.id).length > 0);
const myLeadDepts = () => [...new Set(leadsOf(S.me.id).map(l => l.department_id).concat(S.me.role==='techlead' && S.me.department_id ? [S.me.department_id] : []))];
const leadLabel = l => `${activeLT(l.lead_type_id)?.name || 'Lead'}${D(l.department_id) ? ', '+D(l.department_id) : ''}`;
const leadPills = p => leadsOf(p.id).map(l => `<span class="pill blue">${esc(leadLabel(l))}</span>`).join('');
/* Mirrors public.can_assign_task_to() on the server, which is what actually enforces it */
function canAssignTo(p){
  if (!p || p.status!=='active') return false;
  if (isLead()) return true;
  if (leader(p)) return false;
  if (p.id===S.me.id) return S.me.can_assign || isTeamLead(S.me);
  if (isTeamLead(p) && !S.settings?.leads_can_assign_leads) return false;
  if (S.me.can_assign) return true;
  return !!p.department_id && myLeadDepts().includes(p.department_id);
}
const canCreate = () => isLead() || S.me.role==='techlead' || S.me.can_assign || isTeamLead(S.me);
const canEditTask = t => t.created_by===S.me.id || isLead();
const canUpdateTask = t => canEditTask(t) || t.assigned_to===S.me.id;
/* Review flow: whoever does a task someone else assigned submits it; the assigner (or a leader) confirms it */

const canReview = t => !selfTask(t) && t.assigned_to!==S.me.id && (t.created_by===S.me.id || isLead());
const isDoer = t => t.assigned_to===S.me.id && !selfTask(t);

const canManage = p => S.me.role==='founder' || (S.me.role==='director' && team(p) && p.id!==S.me.id);

let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3800); }
async function q(promise){ const {data,error} = await promise; if(error){ toast(error.message); error.shown=true; throw error; } return data; }
async function send(e, fn){
  e.preventDefault();
  const b = e.target.querySelector('[type=submit]'); if(b) b.disabled = true;
  try { await fn(Object.fromEntries(new FormData(e.target)), e.target); }
  catch(err){ if(!err.shown) toast(err.message || 'Something went wrong. Try again.'); }
  finally { if(b) b.disabled = false; }
  return false;
}
async function run(fn){ try { await fn(); } catch(err){ if(!err.shown) toast(err.message || 'Something went wrong. Try again.'); } }

async function loadAll(){
  const [people,depts,tasks,leaves,offs,notes,acts,events] = await Promise.all([
    q(sb.from('profiles').select('*').order('full_name')),
    q(sb.from('departments').select('*').order('name')),
    q(sb.from('tasks').select('*').order('deadline',{ascending:true,nullsFirst:false})),
    q(sb.from('leaves').select('*').order('created_at',{ascending:false})),
    q(sb.rpc('approved_days')),
    q(sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(60)),
    q(sb.from('activity').select('*').order('created_at',{ascending:false}).limit(200)),
    q(sb.from('events').select('*').order('event_date'))
  ]);
  Object.assign(S,{people,depts,tasks,leaves,offs,notes,acts,events});
  S.me = people.find(p => p.id===S.me.id) || S.me;
  await loadAttendanceCore();
}
/* Attendance and leadership data. Soft-fails so the rest of the app keeps working if the database update is not applied yet. */
const soft = async p => { const {data,error} = await p; return error ? null : data; };
async function loadAttendanceCore(){
  const [settings, leadTypes, teamLeads, bals, ledger] = await Promise.all([
    soft(sb.from('org_settings').select('*').eq('id',1).maybeSingle()),
    soft(sb.from('lead_types').select('*').order('sort').order('name')),
    soft(sb.from('team_leads').select('*')),
    soft(sb.rpc('leave_balances')),
    soft(sb.from('leave_ledger').select('*').order('effective_date',{ascending:false}).limit(500))]);
  S.attReady = !!settings;
  Object.assign(S, {settings, leadTypes:leadTypes||[], teamLeads:teamLeads||[], ledger:ledger||[]});
  S.bal = Object.fromEntries((bals||[]).map(b => [b.user_id, b.summary]));
  if (!S.attReady) return;
  const months = new Set([istToday().slice(0,7), prevMonth(istToday().slice(0,7)), ...S.attMonths]);
  await loadAttMonths([...months], true);
  if (isAdmin()) S.audit = (await soft(sb.from('attendance_audit').select('*').order('created_at',{ascending:false}).limit(150))) || [];
  const reqs = await soft(sb.from('attendance_requests').select('*').order('created_at',{ascending:false}).limit(300));
  S.reqReady = reqs !== null; S.reqs = reqs || [];
}
async function loadAttMonths(months, replace){
  const lo = months.slice().sort()[0] + '-01', hi = monthEnd(months.slice().sort().slice(-1)[0]);
  const [att, vio] = await Promise.all([
    soft(sb.from('attendance').select('*').gte('work_date',lo).lte('work_date',hi).order('work_date',{ascending:false})),
    soft(sb.from('attendance_violations').select('*').gte('work_date',lo).lte('work_date',hi).order('actual_at'))]);
  const keep = (arr, fresh) => replace ? (fresh||[]) : [...arr.filter(x => !(fresh||[]).some(y => y.id===x.id)), ...(fresh||[])];
  S.att = keep(replace ? [] : S.att, att); S.vio = keep(replace ? [] : S.vio, vio);
  months.forEach(m => S.attMonths.add(m));
}
async function ensureMonth(m){ if (S.attReady && !S.attMonths.has(m)) { await loadAttMonths([m]); route(); } }
async function refresh(){ await loadAll(); if(S.me.status!=='active') return gateView(); route(); }

/* ---------- Live updates: bell, pop-ups, lists refresh without reloading ---------- */
function setBell(){

let softT;
function softRefresh(){
  clearTimeout(softT);

    try { await loadAll(); } catch(e){ return; }
    const typing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && document.activeElement.id!=='search';

function onNote(n){
  if (!n || n.user_id!==S.me.id || n.read) return;
  S.notes = [n, ...S.notes.filter(x => x.id!==n.id)];
  setBell(); toast(n.title + (n.body ? ': ' + n.body : '')); alertDevice(n); softRefresh();
}
function live(){
  if (S.chan) return;
  S.chan = sb.channel('live-' + S.me.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'notifications', filter:'user_id=eq.' + S.me.id}, p => onNote(p.new))
    .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, () => softRefresh())
    .on('postgres_changes', {event:'*', schema:'public', table:'leaves'}, () => softRefresh())
    .on('postgres_changes', {event:'*', schema:'public', table:'attendance'}, () => softRefresh());
  if (S.reqReady) S.chan.on('postgres_changes', {event:'*', schema:'public', table:'attendance_requests'}, () => softRefresh());
  S.chan.subscribe();
}
function askAlerts(){ return run(async () => {
  if (!('Notification' in window)) return toast('This browser does not support pop-up alerts. Add the app to your home screen, then try again.');
  const p = await Notification.requestPermission();
  toast(p==='granted' ? 'Alerts are on for this device' : 'Alerts are blocked. Allow notifications for this site in your browser settings.');
  route();
}); }
async function boot(){
  if (!S.depts.length) { const {data} = await sb.from('departments').select('*').order('name'); S.depts = data || []; }
  const {data:{session}} = await sb.auth.getSession();
  if (S.recovery && session) { S.authMode='reset'; return authView(); }
  if (!session) { S.me=null; return authView(); }
  const {data:me,error} = await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if (error || !me) { toast(error?.message || 'Your profile could not be loaded. Sign in again.'); await sb.auth.signOut(); return authView(); }
  S.me = me;
  if (me.status!=='active') return gateView();
  try { await loadAll(); } catch(e){ return; }
  shell(); route(); live();
}

function due(t){
  if (!t.deadline) return '';
  const td = today(), c = ['completed','review'].includes(t.status) ? '' : t.deadline<td ? ' late' : t.deadline===td ? ' now' : '';
  return `<span class="due${c}">${t.deadline===td ? 'Today' : fmt(t.deadline)}</span>`;
}
function prio(t){ return t.priority==='urgent' ? '<span class="pill red">Urgent</span>' : t.priority==='high' ? '<span class="pill amber">High</span>' : ''; }
function reviewPill(t){
  if (t.status==='review') return `<span class="pill amber">${canReview(t) ? 'Needs your review' : 'Submitted'}</span>`;
  if (t.status==='completed' && t.review_result==='approved') return '<span class="pill green">Confirmed</span>';
  if (t.status!=='completed' && t.review_result==='changes') return '<span class="pill red">Changes requested</span>';
  return '';
}
function taskRow(t){
  const sub = t.status==='review' && t.submitted_at ? `submitted ${ago(t.submitted_at)}` : '';
  const tags = reviewPill(t) + prio(t);
  return `<a class="row" href="#task/${t.id}"><span class="st st-${t.status}" title="${STATUS[t.status]}"></span>
    <span class="grow"><b>${esc(t.title)}</b><small>${esc(nm(t.assigned_to))}${t.is_leadership ? ', leadership' : ''}${sub ? ', '+sub : ''}</small>${tags ? `<span class="tags">${tags}</span>` : ''}</span>${due(t)}</a>`;
}

const sec = (title, body, right='') => `<section class="sec"><div class="sh"><h2>${title}</h2>${right}</div>${body}</section>`;
function leavePill(s){ return `<span class="pill ${({pending:'amber',approved:'green',rejected:'red',cancelled:''})[s]}">${s[0].toUpperCase()+s.slice(1)}</span>`; }

function homeView(){
  const t = today(), all = S.tasks.filter(x => !x.archived);
  const mine = all.filter(x => x.assigned_to===S.me.id), open = mine.filter(x => !['completed','review'].includes(x.status));
  const waiting = mine.filter(x => x.status==='review'), fixes = open.filter(x => x.review_result==='changes');
  const reviews = toReview();
  const work = open.filter(x => x.review_result!=='changes');
  const late = work.filter(x => x.deadline && x.deadline<t), now = work.filter(x => x.deadline===t);
  const next = work.filter(x => x.deadline && x.deadline>t), loose = work.filter(x => !x.deadline);
  const soon = all.filter(x => x.assigned_to!==S.me.id && x.status!=='completed' && x.deadline && x.deadline>=t && x.deadline<=addDays(t,7));
  const approvals = S.leaves.filter(l => l.status==='pending' && canApprove(l));

function getLocation(){
  return new Promise(res => {
    if (!('geolocation' in navigator)) return res({status:'unavailable'});
    navigator.geolocation.getCurrentPosition(
      p => res({status:'captured', lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}),
      e => res({status: e.code===1 ? 'denied' : 'unavailable'}),
      {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  });
}
async function lookupAddress(lat, lng){
  try {
    const c = new AbortController(), tm = setTimeout(() => c.abort(), 5000);
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&lat=${lat}&lon=${lng}`, {signal:c.signal, headers:{'Accept-Language':'en'}});
    clearTimeout(tm); if (!r.ok) return null;
    return ((await r.json()).display_name || '').slice(0,300) || null;
  } catch(e) { return null; }
}

    const args = {p_lat:loc.lat ?? null, p_lng:loc.lng ?? null, p_accuracy:loc.acc ?? null, p_address:address, p_location_status:loc.status};
    let data, error;
    try { ({data, error} = await sb.rpc(dir==='in' ? 'attendance_check_in' : 'attendance_check_out', args)); } catch(e) { error = e; }
    if (error) throw new Error(/fetch|network|load failed|timed? ?out/i.test(error.message||'') || !navigator.onLine

  finally { punching = false; }
}

function monthSummary(uid, m){
  const p = P(uid), t = istToday(), days = monthDays(m).filter(d => d<=t);
  const s = {id:uid, name:p.full_name, empId:p.employee_id||'', dept:D(p.department_id), working:0, present:0, late:0, early:0, missing:0, absent:0, leave:0, minutes:0, graceUsed:0, deducted:0};
  days.forEach(d => { const r = attFor(uid,d), st = attStatus(r,uid,d), off = offReason(uid,d);
    if (off==='leave' || r?.day_type==='leave') s.leave++;
    if (!off && !(p.joining_date && p.joining_date>d) && !(S.settings.attendance_start && d < S.settings.attendance_start)) s.working++;
    if (r?.check_in_at) s.present++; if (r?.is_late) s.late++; if (r?.is_early) s.early++; if (st==='missing') s.missing++; if (st==='absent') s.absent++;
    s.minutes += r?.worked_minutes || 0; });
  const vs = S.vio.filter(v => v.user_id===uid && v.work_date.slice(0,7)===m && v.status==='active');
  s.graceUsed = Math.min(S.settings.grace_limit, vs.reduce((n,v) => Math.max(n, v.grace_number||0), 0));
  s.deducted = vs.filter(v => v.deduction_status==='applied').reduce((n,v) => n + Number(v.deduction_days), 0);

function downloadCsv(name, rows){

  const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function leaveView(){
  const approver = ['founder','director'].includes(S.me.role), t = today();
  const kf = S.leaveKind || 'all', byKind = l => kf==='all' || (kf==='wfh' ? isWfh(l) : !isWfh(l));
  const mine = S.leaves.filter(l => l.user_id===S.me.id && byKind(l));
  const review = S.leaves.filter(l => l.status==='pending' && canApprove(l) && byKind(l));
  const tabs = [['mine','My requests']];
  if (approver) tabs.push(['review',`To approve${review.length ? ' ('+review.length+')' : ''}`]);
  if (isLead()) tabs.push(['team','Employees'], ['all','All requests']);
  if (!tabs.some(x => x[0]===S.leaveTab)) S.leaveTab = 'mine';
  const tab = S.leaveTab;
  const mo = t.slice(0,7), wfhMonth = S.leaves.filter(l => l.user_id===S.me.id && isWfh(l) && l.status==='approved' && l.start_date.slice(0,7)===mo).reduce((a,l) => a+l.days, 0);
  const leaveMonth = S.leaves.filter(l => l.user_id===S.me.id && !isWfh(l) && l.status==='approved' && l.start_date.slice(0,7)===mo).reduce((a,l) => a+l.days, 0);
  let body;
  if (tab==='mine') {
    const up = mine.filter(l => l.status==='approved' && l.end_date>=t);
    const bal = S.bal[S.me.id];
    body = `<div class="stats"><div><b>${S.leaves.filter(l=>l.user_id===S.me.id && l.status==='pending').length}</b><small>Pending</small></div><div><b>${leaveMonth}</b><small>Leave days this month</small></div><div><b>${wfhMonth}</b><small>WFH days this month</small></div>${bal ? `<div><b>${Number(bal.balance)}</b><small>Paid leave balance</small></div>` : `<div><b>${up.length}</b><small>Upcoming</small></div>`}</div>
      ${bal ? balanceBlock(S.me.id) : ''}
      ${up.length ? sec('Upcoming', list(up.map(l => leaveRow(l)))) : ''}
      ${sec('History', list(mine.map(l => leaveRow(l)), 'No requests yet.'))}`;
  } else if (tab==='review') body = list(review.map(l => leaveRow(l,true)), 'Nothing is waiting for your approval.');
  else if (tab==='team') return `<div class="head"><h1>Leave and WFH</h1></div>
    <div class="seg">${tabs.map(([k,l]) => `<button class="${k===tab?'on':''}" onclick="S.leaveTab='${k}';route()">${l}</button>`).join('')}</div>${registerView()}`;

function leaveTotals(id, yr){

  const ok = ls.filter(l => l.status==='approved'), inYr = l => l.start_date.slice(0,4)===yr;
  const sum = a => a.reduce((n,l) => n + l.days, 0);
  return {
    leaveYr: sum(ok.filter(l => !isWfh(l) && inYr(l))), leaveMo: sum(ok.filter(l => !isWfh(l) && l.start_date.slice(0,7)===mo)),
    wfhYr: sum(ok.filter(l => isWfh(l) && inYr(l))), pending: ls.filter(l => l.status==='pending').length,
    last: ok.filter(l => !isWfh(l) && l.start_date<=today()).sort((a,b) => a.start_date<b.start_date?1:-1)[0], all: ls };
}

async function saveLeave(f, form){
  if (f.end_date < f.start_date) throw new Error('The end date is before the start date.');
  const wfh = f.kind==='wfh';
  const row = {kind: wfh ? 'wfh' : 'leave', leave_type: wfh ? 'wfh' : f.leave_type, start_date:f.start_date, end_date:f.end_date, reason:f.reason.trim()};

    const path = `leave/${S.me.id}/${crypto.randomUUID()}-${safeName(file.name)}`;
    const {error} = await sb.storage.from('files').upload(path, file); if (error) throw error;
    row.attachment_path = path; row.attachment_name = file.name;

}
/* Any leader adds, retitles or removes leadership. The title is free text (CTO, COO, Head of Growth...).
   "Access" maps to the server role: Leadership = cofounder-level, + approvals = director-level, Founder = founder.
   Server rules (profiles_guard): only the Founder can create or change a Founder; nobody changes their own role or title. */
const ACCESS = {cofounder:'Leadership (admin)', director:'Leadership + leave and account approvals', founder:'Founder (full control)'};
const TITLE_SUGGEST = ['Co-Founder','Director','CEO','CTO','COO','CFO','CMO','Head of Product','Head of Growth','Head of Operations','Program Director','General Manager'];
function leaderForm(){
  const founder = S.me.role==='founder';
  const cand = S.people.filter(p => p.status==='active' && !leader(p)), cur = S.people.filter(p => p.status==='active' && leader(p));
  const access = founder ? ACCESS : {cofounder:ACCESS.cofounder, director:ACCESS.director};
  const canEdit = p => p.id!==S.me.id && (founder || p.role!=='founder');
  openModal(`<h2>Leadership</h2><p class="muted" style="margin-bottom:12px">Give any title you like. Everyone in leadership is an administrator: they see everyone's attendance, correct records, and manage lead roles, settings and leadership. There is no limit on how many.</p>
    ${list(cur.map(p => `<div class="row" style="flex-wrap:wrap">${av(p,30)}<span class="grow" style="min-width:150px"><b>${esc(p.full_name)}</b><small>${esc(roleLabel(p))}${p.id===S.me.id ? ', you' : ''}<br>${esc(ACCESS[p.role] || ROLE[p.role])}</small></span>
      ${canEdit(p) ? `<span style="display:flex;gap:6px"><button class="btn sm" onclick="leaderEdit('${p.id}')">Edit</button><button class="btn sm danger" onclick="run(()=>setLeader('${p.id}','member',null))">Remove</button></span>` : ''}</div>`))}
    <form onsubmit="return send(event,(f)=>setLeader(f.who,f.access,f.title,true))" style="margin-top:14px">
      <label class="field"><span>Person</span><select name="who" required><option value="">Choose</option>${cand.map(p => `<option value="${p.id}">${esc(p.full_name)}${p.designation ? ' ('+esc(p.designation)+')' : ''}</option>`).join('')}</select></label>
      <div class="two"><label class="field"><span>Leadership title</span><input name="title" list="lt_suggest" maxlength="40" required placeholder="Type any title, e.g. CTO"></label>
        <label class="field"><span>Access</span><select name="access">${opts(access, 'cofounder')}</select></label></div>
      <datalist id="lt_suggest">${TITLE_SUGGEST.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      <div class="foot"><button class="btn" type="button" onclick="closeModal()">Close</button><button class="btn primary" type="submit">Add to leadership</button></div></form>`);
}
function leaderEdit(id){
  const p = P(id), founder = S.me.role==='founder';
  const access = founder ? ACCESS : {cofounder:ACCESS.cofounder, director:ACCESS.director};
  openModal(`<h2>Edit ${esc(p.full_name)}</h2><form onsubmit="return send(event,(f)=>setLeader('${id}',f.access,f.title,true))">
    <label class="field"><span>Leadership title</span><input name="title" list="lt_suggest" maxlength="40" required value="${esc(roleLabel(p))}"></label>
    <label class="field"><span>Access</span><select name="access">${opts(access, p.role)}</select></label>
    <datalist id="lt_suggest">${TITLE_SUGGEST.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
    <div class="foot"><button class="btn" type="button" onclick="leaderForm()">Back</button><button class="btn primary" type="submit">Save</button></div></form>`);
}
async function setLeader(id, role, title, adding){
  if (!adding && !confirm(`Remove ${nm(id)} from leadership? They become an employee and lose administrator access.`)) return;
  const t = (title || '').trim() || null;
  const d = await q(sb.from('profiles').update(role==='member' ? {role} : {role, leadership_title:t}).eq('id', id).select());
  if (!d?.length || d[0].role!==role) throw new Error('You are not allowed to make this change.');
  toast(role==='member' ? `${nm(id)} removed from leadership` : `${nm(id)} is now ${t || ROLE[role]}`); await refresh(); leaderForm();
}
/* Lead roles: any number of leads, several per department, configurable lead types. Server enforces admin-only and no self-escalation. */
function leadForm(uid){
  const p = P(uid), cur = S.teamLeads.filter(l => l.user_id===uid), types = S.leadTypes.filter(t => t.active);
  openModal(`<h2>Lead roles for ${esc(p.full_name)}</h2>
    <p class="muted" style="margin-bottom:12px">A lead assigns and reviews work for their department's employees, sees their attendance, and still gets their own tasks. Leads cannot assign to other leads${S.settings?.leads_can_assign_leads ? ' (currently allowed in settings)' : ''} or to leadership.</p>
    ${list(cur.map(l => `<div class="row"><span class="grow"><b>${esc(S.leadTypes.find(t => t.id===l.lead_type_id)?.name || 'Lead')}</b><small>${esc(D(l.department_id))}${l.assigned_by ? ', set by '+esc(nm(l.assigned_by)) : ''}</small></span><button class="btn sm danger" onclick="removeLead('${l.id}','${uid}')">Remove</button></div>`), 'No lead roles yet.')}
    <form onsubmit="return send(event,addLead.bind(null,'${uid}'))" style="margin-top:14px">
      <div class="two"><label class="field"><span>Lead type</span><select name="type" required>${types.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Team</span><select name="dept" required>${S.depts.map(d => `<option value="${d.id}"${d.id===p.department_id?' selected':''}>${esc(d.name)}</option>`).join('')}</select></label></div>
      <div class="foot"><button class="btn" type="button" onclick="closeModal()">Close</button><button class="btn primary" type="submit">Add lead role</button></div></form>`);
}
async function addLead(uid, f){ await q(sb.from('team_leads').insert({user_id:uid, lead_type_id:f.type, department_id:f.dept})); toast('Lead role added'); await refresh(); leadForm(uid); }
function removeLead(id, uid){ if (!confirm('Remove this lead role?')) return; return run(async () => { await q(sb.from('team_leads').delete().eq('id',id)); toast('Lead role removed'); await refresh(); leadForm(uid); }); }

/* ---------- Calendar ---------- */
function dayItems(day){
  const a = [];
  S.events.filter(e => e.event_date===day).forEach(e => a.push({k:e.is_holiday ? 'holiday' : 'event', label:(e.is_holiday ? 'Holiday: ' : '') + e.title, id:e.id}));
  /* Leave and work-from-home are not shown on the calendar (see Home > Today and the Leave page) */
  S.tasks.filter(t => !t.archived && !['completed','review'].includes(t.status) && t.deadline===day).forEach(t => a.push({k:'task', label:t.title+' due', href:'#task/'+t.id}));
  return a;
}
function calView(){
  if (!S.cal) { const d = new Date(); S.cal = {y:d.getFullYear(), m:d.getMonth()}; S.calDay = today(); }
  const {y,m} = S.cal, lead = (new Date(y,m,1).getDay()+6)%7, n = new Date(y,m+1,0).getDate(), td = today();
  let cells = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i=0;i<lead;i++) cells += `<button disabled aria-hidden="true"></button>`;
  for (let d=1; d<=n; d++) {
    const day = `${y}-${pad(m+1)}-${pad(d)}`, its = dayItems(day), kinds = [...new Set(its.map(i => i.k))];
    cells += `<button class="${day===S.calDay?'sel':''}${day===td?' tod':''}" onclick="S.calDay='${day}';route()" aria-label="${fmt(day)}, ${its.length} item${its.length===1?'':'s'}"><span>${d}</span><div class="dots">${kinds.map(k => `<i class="${k}"></i>`).join('')}</div></button>`;
  }
  const its = dayItems(S.calDay);
  const rows = its.map(i => i.href ? `<a class="row" href="${i.href}"><span class="dots"><i class="${i.k}"></i></span><span class="grow wrap"><b style="font-weight:500">${esc(i.label)}</b></span></a>`
    : `<div class="row"><span class="dots"><i class="${i.k}"></i></span><span class="grow wrap"><b style="font-weight:500">${esc(i.label)}</b></span>${(isLead() && i.k==='event') || isAdmin() ? `<button class="btn sm" onclick="delEvent('${i.id}')">Remove</button>` : ''}</div>`);
  return `<div class="head"><h1>${new Date(y,m,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h1>
    <span style="display:flex;gap:6px"><button class="btn sm" onclick="calMove(-1)" aria-label="Previous month">Prev</button><button class="btn sm" onclick="calMove(1)" aria-label="Next month">Next</button>${isLead() ? `<button class="btn sm primary" onclick="eventForm()">Add date</button>` : ''}</span></div>
    <div class="cal">${cells}</div>
    <p class="muted" style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;font-size:13px"><span class="dots" style="align-items:center"><i></i>&nbsp;Task deadline</span><span class="dots" style="align-items:center"><i class="event"></i>&nbsp;Team date</span><span class="dots" style="align-items:center"><i class="holiday"></i>&nbsp;Holiday</span></p>
    ${sec(fmtLong(S.calDay), list(rows, 'Nothing on this day.'))}`;
}
function calMove(n){ const d = new Date(S.cal.y, S.cal.m+n, 1); S.cal = {y:d.getFullYear(), m:d.getMonth()}; S.calDay = ymd(d); route(); }
function eventForm(){
  openModal(`<h2>Add a team date</h2><form onsubmit="return send(event,saveEvent)">
    <label class="field"><span>Title</span><input name="title" placeholder="Demo day, holiday, offsite" required></label>
    <label class="field"><span>Date</span><input name="event_date" type="date" value="${S.calDay || today()}" required></label>
    ${S.attReady && isAdmin() ? `<label class="chk"><input type="checkbox" name="is_holiday"> Company holiday (no attendance rules apply that day)</label>` : ''}
    <div class="foot"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Add date</button></div></form>`);
}
async function saveEvent(f){ const row = {title:f.title.trim(), event_date:f.event_date}; if (f.is_holiday) row.is_holiday = true;
  await q(sb.from('events').insert(row)); closeModal(); toast(f.is_holiday ? 'Holiday added' : 'Date added'); S.calDay = f.event_date; await refresh(); }
function delEvent(id){ return run(async () => { await q(sb.from('events').delete().eq('id',id)); toast('Date removed'); await refresh(); }); }

/* ---------- Activity, notifications, search, settings ---------- */
function actView(){
  const row = a => { const href = a.entity_type==='task' ? '#task/'+a.entity_id : a.entity_type==='leave' ? '#leave' : '#people';
    return `<div class="row">${av(P(a.actor_id),28)}<a class="grow wrap" href="${href}"><b style="font-weight:500">${esc(a.message)}</b></a><span class="due">${ago(a.created_at)}</span><button class="btn sm danger" onclick="delAct('${a.id}')">Delete</button></div>`; };
  return `<div class="head"><h1>Activity</h1></div>${list(S.acts.map(isLead() ? row : actRow), 'Activity shows up here as the team works.')}`;
}
function delTask(id){ if(!confirm('Delete this task for everyone? Its comments and files go too. This cannot be undone.')) return; return run(async () => { await q(sb.from('tasks').delete().eq('id',id)); toast('Task deleted'); await loadAll(); go('tasks'); }); }
function delLeave(id){ if(!confirm('Delete this leave record? This cannot be undone.')) return; return run(async () => { await q(sb.from('leaves').delete().eq('id',id)); toast('Leave deleted'); await refresh(); }); }
function delAct(id){ if(!confirm('Delete this activity entry?')) return; return run(async () => { await q(sb.from('activity').delete().eq('id',id)); toast('Activity deleted'); await refresh(); }); }
function delPerson(id){ if(!confirm('Delete '+nm(id)+' permanently? Their login and leave records are removed. Their tasks stay, unassigned. This cannot be undone.')) return; return run(async () => { await q(sb.rpc('delete_person',{target:id})); toast('Person deleted'); await loadAll(); go('people'); }); }
function inboxView(){
  const rows = S.notes.map(n => `<a class="row" href="#" onclick="openNote('${n.id}');return false"><span class="st ${n.read ? '' : 'st-in_progress'}" style="${n.read ? 'visibility:hidden' : 'background:var(--accent)'}"></span>
    <span class="grow wrap"><b style="font-weight:${n.read?500:700}">${esc(n.title)}</b><small>${esc(n.body||'')}</small></span><span class="due">${ago(n.created_at)}</span></a>`);
  const canAsk = 'Notification' in window && Notification.permission==='default';
  const alertsRow = canAsk ? `<div class="banner blue"><span class="grow"><b>Get pop-up alerts on this device</b><span class="muted">See submissions, reviews and approvals the moment they happen, even when this tab is in the background.</span></span><span class="acts"><button class="btn sm primary" onclick="askAlerts()">Turn on alerts</button></span></div>` : '';
  return `<div class="head"><h1>Notifications</h1>${S.notes.some(n=>!n.read) ? `<button class="btn sm" onclick="readAll()">Mark all as read</button>` : ''}</div>${alertsRow}${list(rows, 'You are all caught up.')}`;
}
async function openNote(id){
  const n = S.notes.find(x => x.id===id); if(!n) return;
  if (!n.read) { n.read = true; sb.from('notifications').update({read:true}).eq('id',id).then(()=>{}); }
  if (n.entity_type==='attendance') S.attTab = (['att_review','att_dispute'].includes(n.type) && isAdmin()) || (n.type==='att_request' && isApprover()) ? 'review' : 'me';
  go(n.entity_type==='task' ? 'task/'+n.entity_id : n.entity_type==='leave' ? 'leave' : n.entity_type==='attendance' ? 'attendance'
    : ['lead_assigned','lead_removed'].includes(n.type) ? 'person/'+S.me.id : ['account_approved','location'].includes(n.type) ? 'home' : 'people');
}
function readAll(){ return run(async () => { await q(sb.from('notifications').update({read:true}).eq('user_id',S.me.id).eq('read',false)); S.notes.forEach(n => n.read = true); route(); }); }
function searchView(){
  const k = S.q.toLowerCase();
  const ts = S.tasks.filter(t => !t.archived && ((t.title+' '+(t.description||'')).toLowerCase().includes(k)));
  const ps = S.people.filter(p => p.status==='active' && [p.full_name,p.designation,p.email,D(p.department_id)].join(' ').toLowerCase().includes(k));
  return `<div class="head"><h1>Results for "${esc(S.q)}"</h1></div>
    ${sec('Tasks', list(ts.map(taskRow), 'No tasks match.'))}
    ${sec('People', ps.length ? `<div class="people">${ps.map(personCard).join('')}</div>` : `<div class="list"><div class="empty">No people match.</div></div>`)}`;
}
function settingsView(){
  if (!isAdmin()) return `<div class="list"><div class="empty">Settings are managed by the Founder, Co-Founder and Director.</div></div>`;
  const s = S.settings, founder = S.me.role==='founder';
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const policy = !s ? `<div class="list"><div class="empty">Attendance settings appear once the database update is applied.</div></div>` : `<form class="kv" style="display:block" onsubmit="return send(event,saveSettings)">
      <div class="two"><label class="field"><span>Work starts</span><input name="work_start" type="time" value="${hm(s.work_start)}" required></label>
        <label class="field"><span>Work ends</span><input name="work_end" type="time" value="${hm(s.work_end)}" required></label></div>
      <p class="muted" style="margin:-6px 0 14px">Time zone: ${esc(s.timezone)}. Checking in after the start time is late; checking out before the end time is an early checkout.</p>
      <div class="field"><span>Weekly offs</span><div style="display:flex;gap:10px;flex-wrap:wrap">${DOW.map((d,i) => `<label class="chk" style="margin:0"><input type="checkbox" name="off${i}"${s.weekly_offs.includes(i)?' checked':''}> ${d}</label>`).join('')}</div></div>
      <div class="two"><label class="field"><span>Grace chances per period</span><input name="grace_limit" type="number" min="0" max="100" value="${s.grace_limit}" required></label>
        <label class="field"><span>Grace period</span><select name="grace_period">${opts({month:'Calendar month',quarter:'Quarter',year:'Year'}, s.grace_period)}</select></label></div>
      <div class="two"><label class="field"><span>Deduction after grace (days)</span><input name="deduction_days" type="number" step="0.25" min="0.25" max="1" value="${Number(s.deduction_days)}" required></label>
        <label class="field"><span>Paid leave earned per month</span><input name="monthly_leave_quota" type="number" step="0.5" min="0" max="10" value="${Number(s.monthly_leave_quota)}" required></label></div>
      <div class="two"><label class="field"><span>Leave balance counts from</span><input name="leave_policy_start" type="date" value="${s.leave_policy_start}" required></label>
        <label class="field"><span>Attendance tracking started</span><input name="attendance_start" type="date" value="${s.attendance_start}" required><small>Earlier days are never marked absent</small></label></div>
      <label class="chk"><input type="checkbox" name="count_same_day_separately"${s.count_same_day_separately?' checked':''}> A late check-in and an early checkout on the same day count as two occurrences</label>
      <label class="chk"><input type="checkbox" name="rules_on_wfh"${s.rules_on_wfh?' checked':''}> Apply timing rules on approved work-from-home days</label>
      <label class="chk"><input type="checkbox" name="leave_carry_forward"${s.leave_carry_forward?' checked':''}> Unused paid leave carries forward to the next month</label>
      <label class="chk"><input type="checkbox" name="allow_negative_balance"${s.allow_negative_balance?' checked':''}> Allow deductions to make the leave balance negative (otherwise they wait for review)</label>
      <p class="muted" style="margin:0 0 10px">Location is always required to check in and check out.</p>
      <label class="chk"><input type="checkbox" name="leads_can_assign_leads"${s.leads_can_assign_leads?' checked':''}> Team leads may assign tasks to other leads in their team</label>
      <p class="muted" style="margin-bottom:12px">Changes apply to new check-ins and check-outs. Past records keep their outcome unless corrected. Holidays are added from the Calendar. Missing check-outs are flagged, never counted as early checkouts.</p>
      <div class="foot"><button class="btn primary" type="submit">Save attendance settings</button></div></form>`;
  const types = sec('Lead types', list(S.leadTypes.map(t => `<div class="row"><span class="grow"><b>${esc(t.name)}</b><small>${S.teamLeads.filter(l => l.lead_type_id===t.id).length} people${t.active ? '' : ', turned off'}</small></span>
      <button class="btn sm" onclick="renameLeadType('${t.id}')">Rename</button><button class="btn sm" onclick="toggleLeadType('${t.id}',${!t.active})">${t.active ? 'Turn off' : 'Turn on'}</button></div>`), 'No lead types yet.')
    + `<form onsubmit="return send(event,addLeadType)" style="display:flex;gap:8px;margin-top:10px"><input name="name" placeholder="New lead type, e.g. Design Lead" aria-label="New lead type" required><button class="btn" type="submit">Add type</button></form>`);
  return `<div class="head"><h1>Settings</h1></div>
    ${sec('Attendance and leave policy', policy)}
    ${s ? types : ''}
    ${sec('Departments', list(S.depts.map(d => `<div class="row"><span class="grow"><b>${esc(d.name)}</b><small>${S.people.filter(p=>p.department_id===d.id&&p.status==='active').length} people</small></span>
      <button class="btn sm" onclick="renameDept('${d.id}')">Rename</button><button class="btn sm danger" onclick="delDept('${d.id}')">Delete</button></div>`), 'No departments yet.')
      + `<form onsubmit="return send(event,addDept)" style="display:flex;gap:8px;margin-top:10px"><input name="name" placeholder="New department name" aria-label="New department name" required><button class="btn" type="submit">Add department</button></form>`)}
    ${sec('Roles and access', `<div class="list"><div class="row"><span class="grow wrap"><b>Roles are set per person</b><small>Open someone in People. "Manage role and access" changes their organisation role, status and reporting line. Founder, Co-Founder and Director are administrators automatically; team leads are not. "Lead roles" makes them a lead of one or more teams.</small></span><a class="btn sm" href="#people">Open people</a></div></div>`)}`;
}
async function saveSettings(f){
  const offs = [0,1,2,3,4,5,6].filter(i => f['off'+i]);
  if (f.work_end <= f.work_start) throw new Error('Work must end after it starts.');
  const row = {work_start:f.work_start, work_end:f.work_end, weekly_offs:offs, grace_limit:+f.grace_limit, grace_period:f.grace_period, deduction_days:+f.deduction_days,
    monthly_leave_quota:+f.monthly_leave_quota, leave_policy_start:f.leave_policy_start, attendance_start:f.attendance_start, count_same_day_separately:!!f.count_same_day_separately, rules_on_wfh:!!f.rules_on_wfh,
    leave_carry_forward:!!f.leave_carry_forward, allow_negative_balance:!!f.allow_negative_balance, require_location:true, leads_can_assign_leads:!!f.leads_can_assign_leads};
  const d = await q(sb.from('org_settings').update(row).eq('id',1).select());
  if (!d?.length) throw new Error('Only administrators can change these settings.');
  toast('Settings saved'); await refresh();
}
async function addLeadType(f, form){ await q(sb.from('lead_types').insert({name:f.name.trim(), sort:(S.leadTypes.length+1)*10})); form.reset(); toast('Lead type added'); await refresh(); }
function renameLeadType(id){ const t = S.leadTypes.find(x => x.id===id), name = prompt('Lead type name', t.name); if (!name || !name.trim()) return; return run(async () => { await q(sb.from('lead_types').update({name:name.trim()}).eq('id',id)); await refresh(); }); }
function toggleLeadType(id, on){ return run(async () => { await q(sb.from('lead_types').update({active:on}).eq('id',id)); toast(on ? 'Turned on' : 'Turned off. People with this lead type lose its permissions.'); await refresh(); }); }
async function addDept(f, form){ await q(sb.from('departments').insert({name:f.name.trim()})); form.reset(); toast('Department added'); await refresh(); }
function renameDept(id){ const d = S.depts.find(x => x.id===id), name = prompt('Department name', d.name); if(!name || !name.trim()) return; return run(async () => { await q(sb.from('departments').update({name:name.trim()}).eq('id',id)); await refresh(); }); }
function delDept(id){ if(!confirm('Delete this department? People and tasks in it are kept, without a department.')) return; return run(async () => { await q(sb.from('departments').delete().eq('id',id)); toast('Department deleted'); await refresh(); }); }
function moreView(){
  const n = S.notes.filter(x => !x.read).length;
  const items = [['calendar','Calendar','calendar'],['activity','Activity','activity'],['inbox',`Notifications${n ? ' ('+n+')' : ''}`,'bell'],['person/'+S.me.id,'My profile','people']];
  if (isAdmin()) items.push(['settings','Settings','settings']);
  return `<div class="head"><h1>More</h1></div><div class="list">${items.map(([h,l,i]) => `<a class="row nav" style="border-radius:0;color:var(--ink)" href="#${h}">${svg(i)}<span class="grow"><b>${l}</b></span></a>`).join('')}
    <button class="row link" style="width:100%;color:var(--red);padding:11px 14px" onclick="signOut()">Sign out</button></div>`;
}
boot();
</script>
</body>
</html>
